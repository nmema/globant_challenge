---
repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        name: black
        language: python
        types: [python]
        exclude: (data|docs/)
        args:
          - --line-length=88
          - --skip-string-normalization

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        name: isort
        language: python
        types: [python]
        exclude: (data|docs/)
        args:
          - --profile=black
          - --multi-line=3
          - --line-length=88
          - --trailing-comma

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        exclude: (data|docs/)
        args:
          - --max-line-length=88
          - --disable=logging-fstring-interpolation
          - --extension-pkg-whitelist=pydantic

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        name: flake8
        language: python
        types: [python]
        exclude: (data|docs/)
        additional_dependencies: [
          "flake8-bugbear",
          "flake8-comprehensions",
          "flake8-mutable",
          "flake8-print",
          "flake8-simplify",
          "flake8-docstrings",
          "pandas-vet",
        ]
        args:
          - "--max-line-length=88"
          - "--max-complexity=10"
          - "--ignore=E501,W503,E203"

  - repo: https://github.com/pycqa/bandit
    rev: 1.8.5
    hooks:
      - id: bandit
        exclude: (data|docs/)
        args: ['-iii', '-ll']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-docstring-first
        exclude: (data|docs/)
      - id: check-added-large-files
        exclude: (data|docs/)
      - id: detect-private-key
        exclude: (data|docs/)
      - id: end-of-file-fixer
        exclude: (data|docs/)
      - id: no-commit-to-branch
        exclude: (data|docs/)
      - id: check-merge-conflict
        exclude: (data|docs/)
      - id: trailing-whitespace
        exclude: (data|docs/)
      - id: check-yaml
        exclude: (data|docs/)
      - id: check-ast
        exclude: (data|docs/)
      - id: debug-statements
        exclude: (data|docs/)
      - id: mixed-line-ending
        exclude: (data|docs/)
